name: Framework ROCm 7 Build

# We use workflow_dispatch to allow you to manually trigger this
# and customize the AMDGPU target if you switch laptops/cards.
on:
  workflow_dispatch:
    inputs:
      gpu_targets:
        description: 'AMDGPU Targets (semicolon separated)'
        required: true
        default: 'gfx1151'
      rocm_version:
        description: 'ROCm Version (must match the rocm_v7_2 preset)'
        required: true
        default: '7.2.1'
      push_to_registry:
        description: 'Push to GHCR?'
        type: boolean
        default: true

env:
  # We use the GitHub Container Registry by default for forks
  REGISTRY: ghcr.io
  # process.env.GITHUB_REPOSITORY is "your-username/ollama"
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Calculate Version Flags (Kept from original to ensure 'ollama -v' works)
  setup-environment:
    runs-on: ubuntu-latest
    outputs:
      GOFLAGS: ${{ steps.goflags.outputs.GOFLAGS }}
      VERSION: ${{ steps.goflags.outputs.VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set environment
        id: goflags
        run: |
          # If triggered manually, we might not be on a tag. Default to sha if needed.
          VERSION=${GITHUB_REF_NAME#v}
          if [ "${{ github.ref_type }}" != "tag" ]; then
            VERSION="${VERSION}-$(git rev-parse --short HEAD)"
          fi
          
          echo GOFLAGS="'-ldflags=-w -s \"-X=github.com/ollama/ollama/version.Version=${VERSION}\" \"-X=github.com/ollama/ollama/server.mode=release\"'" >>$GITHUB_OUTPUT
          echo VERSION="${VERSION}" >>$GITHUB_OUTPUT

  # 2. The Heavy Docker Build
  build-framework-image:
    needs: setup-environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to ghcr.io

    steps:
      # The ROCm "complete" base image unpacks to tens of GB, so the runner needs
      # headroom. Only reclaiming space on the filesystem backing
      # /var/lib/docker helps here -- freeing /mnt does nothing for the build.
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h / /mnt

          # Remove large directories (all on /)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          # Remove large packages
          sudo apt-get remove -y '^aspnetcore-.*' || true
          sudo apt-get remove -y '^dotnet-.*' || true
          sudo apt-get remove -y '^llvm-.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get remove -y '^mongodb-.*' || true
          sudo apt-get remove -y '^mysql-.*' || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
          sudo apt-get remove -y google-cloud-sdk google-cloud-cli || true
          sudo apt-get autoremove -y
          sudo apt-get clean

          # -a removes all unused images, not just dangling ones. Safe here:
          # nothing we need has been pulled yet.
          sudo docker image prune --all --force

          echo "Disk space after cleanup:"
          df -h / /mnt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the Container registry
        if: ${{ inputs.push_to_registry }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Target lists are semicolon separated and may contain ':' (e.g.
      # "gfx90a:xnack-"), neither of which is legal in a Docker tag.
      - name: Slugify GPU targets for tagging
        id: arch
        run: echo "slug=$(echo '${{ inputs.gpu_targets }}' | tr ';:' '__')" >>$GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag as :rocm7-gfx1151
            type=raw,value=rocm7-${{ steps.arch.outputs.slug }}
            # Tag as :framework-latest
            type=raw,value=framework-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: rocm7-final
          push: ${{ inputs.push_to_registry }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # These names must match the ARGs declared in the Dockerfile.
          build-args: |
            ROCMVERSION=${{ inputs.rocm_version }}
            AMDGPU_TARGETS=${{ inputs.gpu_targets }}
            GOFLAGS=${{ needs.setup-environment.outputs.GOFLAGS }}
            CGO_CFLAGS=-O3
            CGO_CXXFLAGS=-O3
          cache-from: type=gha
          cache-to: type=gha,mode=max
